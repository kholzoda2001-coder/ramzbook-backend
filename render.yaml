# Backend-и ЗАХИРАВӢ дар Render (нақшаи ройгон). Асосӣ — Vercel.
#
# Нақш: агар Vercel лимитро гузарад / pause шавад, барнома худкор ба ин сервис
# мегузарад (ниг. ApiConfig.fallbackUrl дар ramzbook-frontend).
#
# ⚠️ ҚОИДАҲО:
#  • БАЗА — ҳамон Neon (`DATABASE_URL`), ҳамон қимат ки дар Vercel аст.
#  • `JWT_SECRET` ва `OTP_PEPPER` БОЯД АЙНАН ҳамон қимати Vercel бошанд —
#    вагарна токени ҳамаи корбарон беэътибор мешавад ва онҳо аз аккаунт мебароянд.
#  • Build-и ин ҷо БЕ `prisma db push` аст: схемаи базаро танҳо Vercel тағйир
#    медиҳад, то ду ҷо ҳамзамон схемаро нагардонанд.
#  • Сирҳо дар файл НЕСТАНД (`sync: false`) — худат дар панели Render мегузорӣ.
#  • Нақшаи ройгон: баъд аз 15 дақиқа бекорӣ «мехобад», бедоршавӣ ~1 дақиқа.

services:
  - type: web
    name: ramzgo-api
    runtime: node
    plan: free
    region: frankfurt # ҳамон минтақаи Neon (eu-central-1)
    branch: main
    buildCommand: npm install && npx prisma generate && npx next build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # Сирҳо — қиматро дар панели Render аз Vercel нусха кун:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: ZUDSMS_LOGIN
        sync: false
      - key: ZUDSMS_PASS_SALT_HASH
        sync: false
      - key: ZUDSMS_SENDER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        sync: false
      - key: GOOGLE_PLAY_CREDENTIALS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_DAILY_GRANTS
        sync: false
      - key: GOOGLE_TTS_KEY
        sync: false
      - key: GOOGLE_TRANSLATE_KEY
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LIBRARY_STRIP_LOCKED_MEDIA
        sync: false
      - key: OTP_DEMO_ENABLED
        sync: false
      - key: OTP_DEMO_CODE
        sync: false
      - key: ALLOW_MOCK_SOCIAL
        sync: false
